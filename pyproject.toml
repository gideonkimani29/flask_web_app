[project]
name = "flask-web-app"
version = "0.1.0"
description = "Production-ready FastAPI service integrating the M-Pesa Daraja API"
readme = "README.md"
authors = [
    { name = "Gideon Kimani", email = "gideonkimani29@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # Web framework & server
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    # HTTP client
    "httpx==0.27.0",
    # Data validation & settings
    "pydantic==2.7.3",
    "pydantic-settings==2.3.1",
    # Database (async ORM + migrations)
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
    "aiosqlite==0.20.0",
    # Configuration
    "python-dotenv==1.0.1",
    # Auth utilities
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    # Structured logging
    "structlog==24.2.0",
    # Retry / resilience
    "tenacity==8.3.0",
    # Form / multipart support
    "python-multipart==0.0.9",
    # Async file I/O
    "aiofiles==23.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    # httpx is also used as the async test client
    "httpx==0.27.0",
]

[project.scripts]
flask-web-app = "flask_web_app:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
omit = ["app/__init__.py"]
